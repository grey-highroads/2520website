<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2520 Consulting | Copy Prototype</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #fff; }
  body { opacity: 0; }
</style>
</head>
<body>
<script>
(async function () {
  const response = await fetch('/index.html', { cache: 'no-store' });
  const html = await response.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');

  doc.title = '2520 Consulting';

  const text = (selector, value, root = doc) => {
    const node = root.querySelector(selector);
    if (node) node.textContent = value;
  };

  const htmlSet = (selector, value, root = doc) => {
    const node = root.querySelector(selector);
    if (node) node.innerHTML = value;
  };

  const nav = doc.querySelectorAll('.rail-nav a');
  const navLabels = [
    '01 / START HERE',
    '02 / WHAT I WORK ON',
    '03 / TRACK RECORD',
    '04 / EXPERIENCE',
    '05 / GREY GARNER',
    '06 / CONTACT'
  ];
  nav.forEach((item, i) => { if (navLabels[i]) item.textContent = navLabels[i]; });

  htmlSet('.rail-contact', 'PRODUCT / POSITIONING / PRICING / GROWTH<br><a href="mailto:grey@2520consulting.com">grey@2520consulting.com</a>');

  text('.hero-kicker', 'PRODUCT / POSITIONING / PRICING / GROWTH');
  text('.hero h1', "When something important isn't working, I help you figure out why and what to do next.");
  text('.hero-side p', "Founders usually call when growth has slowed, the roadmap is a mess, the story isn't landing, pricing feels wrong, or the team keeps circling the same decision. I get up to speed fast, find the real problem, and help the team decide what to do next.");
  text('.hero-side a', 'START HERE ↓');

  const offers = doc.querySelector('.offers');
  text('.section-head .eyebrow', '01 / START HERE', offers);
  text('.section-head h2', "Growth slowed. The roadmap is stuck. The story isn't landing. Pricing feels wrong.", offers);
  text('.section-head p', 'Those problems are often connected. I look across the product, customers, market, numbers, and team before recommending what to change.');

  const offerRows = offers.querySelectorAll('.offer');
  const offerCopy = [
    {
      title: "Figure out what's happening",
      meta: '1–2 WEEKS',
      copy: "I talk with the people closest to the problem and review what is already there: product, customer feedback, numbers, market context, plans, and recent decisions. I am looking for the gap between what the team expects and what is happening.",
      forLine: "Best when everyone agrees there's a problem but not on the cause.",
      outcome: 'My assessment of what is happening, why I think it is happening, and which decisions need attention first.'
    },
    {
      title: 'Fix the right problem',
      meta: 'FOCUSED WORK',
      copy: 'Once the problem is clear, we make the decisions. What changes. What stays. What comes first. Who owns what. The work might center on product, positioning, pricing, growth, or a combination of them.',
      forLine: 'The scope follows the problem instead of forcing the problem into a service package.',
      outcome: 'A specific strategy, clear priorities, and a near-term plan the team knows how to execute.'
    },
    {
      title: 'Keep me in the room',
      meta: 'ONGOING',
      copy: 'I stay involved while the team puts the plan to work. We talk through new information, hard calls, changing priorities, and the decisions where an experienced outside perspective helps.',
      forLine: 'For founders who want another experienced brain involved without adding a full-time executive.',
      outcome: 'Ongoing access, working sessions, and informed advice from someone who already knows the business.'
    }
  ];

  offerRows.forEach((row, i) => {
    const c = offerCopy[i];
    if (!c) return;
    text('.offer-title h3', c.title, row);
    text('.offer-meta', c.meta, row);
    text('.offer-copy', c.copy, row);
    text('.offer-for', c.forLine, row);
    htmlSet('.deliverable', '<span class="deliverable-label">YOU GET</span>' + c.outcome, row);
  });

  text('.interrupt p', "Before you change the roadmap, rewrite the homepage, or cut the price, make sure you're fixing the right thing.");

  const range = doc.querySelector('#advisory');
  text('.eyebrow', '02 / WHAT I WORK ON', range);
  text('.copy h2', 'Product. Positioning. Pricing. Growth. They affect each other.', range);
  text('.copy p', "I've led all four inside growing software companies. That matters when the obvious answer belongs to one function but the real problem sits somewhere else.", range);
  const rangeMeta = range.querySelectorAll('.retainer-meta > div');
  if (rangeMeta[0]) {
    text('b', 'COMMON QUESTIONS', rangeMeta[0]);
    text('p', 'What should we build next? Why has growth stalled? Is the positioning wrong? Are we priced correctly? Why are good people pulling in different directions?', rangeMeta[0]);
  }
  if (rangeMeta[1]) {
    text('b', 'WHAT I BRING', rangeMeta[1]);
    text('p', 'I get up to speed quickly, ask good questions, say what I think, make a recommendation, and stay close enough to see what happens.', rangeMeta[1]);
  }

  const proof = doc.querySelector('#track-record');
  text('.section-head h2', 'Results from the last 15 years.', proof);

  const ownership = doc.querySelector('#why-me');
  text('.section-head .eyebrow', '04 / EXPERIENCE', ownership);
  text('.section-head h2', "I've been accountable for the decisions I advise on.", ownership);
  const ownershipRows = ownership.querySelectorAll('.ownership-item');
  const ownershipCopy = [
    {
      title: "I've owned the product.",
      body: "Owned the roadmap, prioritized the backlog, shipped releases, and explained tradeoffs to the board. I know the difference between a strategy problem and an execution problem because I've been accountable for both."
    },
    {
      title: "I've owned the story.",
      body: "Positioning, messaging, go-to-market, brand. I've done the work of making a company easier to understand and easier to buy, then watched the market tell us whether we were right."
    },
    {
      title: "I've owned the revenue.",
      body: "Customer acquisition, pricing, retention, expansion. I've run the numbers, changed the model, and lived with the result. Strategy feels different when revenue is attached."
    }
  ];
  ownershipRows.forEach((row, i) => {
    const c = ownershipCopy[i];
    if (!c) return;
    text('h3', c.title, row);
    text('p', c.body, row);
  });

  const about = doc.querySelector('#about');
  const aboutParagraphs = about.querySelectorAll('.about-copy p');
  if (aboutParagraphs[0]) aboutParagraphs[0].textContent = 'I spent the first half of my career as a recording artist and producer, and the second building and leading software companies. Both jobs taught me to listen closely, make decisions with incomplete information, and get a group of people moving in the same direction.';
  if (aboutParagraphs[1]) aboutParagraphs[1].textContent = 'At Emma, Kindful, and Gun.io, I led product, marketing, and strategy from early stage through acquisition and scale. I also run Higher Roads, a Nashville creative technology studio. Through 2520, I work directly with founders and leadership teams when an important business problem crosses more than one function.';

  const contact = doc.querySelector('#contact');
  text('h2', "Tell me what's stuck.", contact);
  text('p', "30 minutes. Tell me what's happening, what you've tried, and where the team is getting hung up. I'll tell you how I'd approach it and whether I'm the right person to help.", contact);

  doc.querySelectorAll('script').forEach(node => node.remove());
  document.open();
  document.write('<!DOCTYPE html>' + doc.documentElement.outerHTML);
  document.close();
})().catch(function (error) {
  document.body.style.opacity = '1';
  document.body.textContent = 'Unable to load the copy prototype.';
  console.error(error);
});
</script>
</body>
</html>
